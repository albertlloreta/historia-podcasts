<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="format-detection" content="telephone=no">
<title>Història en Podcasts · allr.cat</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
h1, h2, h3 { font: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }

:root {
  --bg: #fdf6e3;
  --bg-2: #ede8d6;
  --bg-3: #e0d7b8;
  --accent-rgb: 42, 145, 161;
  --fg: #002b36;
  --muted: #586e75;
  --faint: #839496;
  --border: #adb8b8;
  --accent: #2a91a1;
  --controls-h: 96px;
  --player-h: 0px;
  --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, "Inter", sans-serif;
  --serif: var(--sans);
  --mono: ui-monospace, SFMono-Regular, "Cascadia Mono", "Roboto Mono", Menlo, Monaco, Consolas, monospace;
  /* Com els #tags d'Obsidian (AnuPpuccin): accent al 10/20/15 % */
  --row: rgba(var(--accent-rgb), 0.1);
  --row-hover: rgba(var(--accent-rgb), 0.2);
  --row-border: rgba(var(--accent-rgb), 0.15);
  --tint: rgba(var(--accent-rgb), 0.3);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #3a3845;
    --bg-2: #2f2e38;
    --bg-3: #554d52;
    --accent-rgb: 182, 186, 226;
    --fg: #fadac3;
    --muted: #ad907c;
    --faint: #786660;
    --border: #4c464e;
    --accent: #b6bae2;
  }
}

html { scroll-padding-top: var(--controls-h); }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--fg);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding-bottom: var(--player-h);
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 920px; margin: 0 auto; padding: 0 2rem; }

/* ── Controls ── */
.controls-bar {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg-2);
}
.controls-row { display: flex; align-items: center; gap: 1.25rem; padding: 0.7rem 0; }
.controls-row + .controls-row { padding-top: 0; }

.search-wrap { flex: 1; min-width: 0; }
.search-wrap input {
  width: 100%;
  padding: 0.5rem 0.75rem;
  background: var(--bg);
  border: 0; border-radius: 4px;
  color: var(--fg);
  font: inherit; font-size: 0.9rem;
  outline: none;
}
.search-wrap input:focus { background: var(--row-hover); }
.search-wrap input::placeholder { color: var(--faint); }
.search-count { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); white-space: nowrap; }

.tabs { display: flex; flex-wrap: wrap; flex: 1; min-width: 0; gap: 0.15rem 0.25rem; font-size: 0.8rem; }
.tabs button { padding: 0.25rem 0.6rem; color: var(--muted); border-radius: 4px; white-space: nowrap; }
.tabs button:hover { color: var(--fg); background: var(--bg-3); }
.tabs button.active { color: var(--bg); background: var(--fg); }
.tabs-label { font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); width: 4.5rem; flex-shrink: 0; }
.fold-all { margin-left: auto; font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
.fold-all:hover { color: var(--fg); }

/* ── Intro ── */
.page-intro { padding: 3.5rem 0 2.5rem; max-width: 640px; }
.page-label { font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.9rem; }
.page-title { font-family: var(--serif); font-size: 2.3rem; font-weight: 700; letter-spacing: -0.015em; line-height: 1.15; margin-bottom: 1rem; }
.page-desc { font-size: 0.92rem; color: var(--muted); line-height: 1.7; }
.page-desc + .page-desc { margin-top: 0.6rem; font-size: 0.82rem; }
.sources { list-style: none; margin-top: 0.2rem !important; }
.page-desc a { text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 3px; }
.page-desc a:hover { text-decoration-color: currentColor; }

/* ── Èpoques ── */
.era-section { margin-bottom: 0.75rem; }
.era-section:last-of-type { margin-bottom: 3rem; }
.era-section[hidden] { display: none; }
.era-head {
  position: sticky; top: var(--controls-h); z-index: 50;
  background: var(--bg);
}
.era-head h2 { background: rgba(var(--accent-rgb), 0.22); border: 1px solid var(--row-border); border-radius: 4px; }
.era-toggle {
  width: 100%;
  display: flex; align-items: baseline; gap: 0.9rem;
  padding: 0.9rem 1rem 0.8rem;
  text-align: left;
}
.era-toggle:hover .era-name { color: var(--accent); }
.era-chev { width: 0.8rem; flex-shrink: 0; color: var(--muted); transition: transform 0.15s; align-self: center; }
.era-section.collapsed .era-chev { transform: rotate(-90deg); }
.era-name { font-family: var(--serif); font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; }
.era-years { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); }
.era-count { margin-left: auto; font-family: var(--mono); font-size: 0.72rem; color: var(--muted); }
.era-section.collapsed .era-body { display: none; }

/* ── Episodis ── */
.era-body { list-style: none; display: grid; gap: 3px; padding-top: 3px; }
.ep {
  background: var(--row);
  border: 1px solid var(--row-border);
  border-radius: 4px;
  content-visibility: auto;
  contain-intrinsic-size: auto 52px;
}
.ep:hover, .ep.open { background: var(--row-hover); }
.ep.playing { background: var(--tint); }
.ep[hidden] { display: none; }
.ep-row {
  display: grid;
  grid-template-columns: 7.5rem 1fr auto 2.25rem;
  align-items: baseline;
  gap: 1rem;
  padding: 0.75rem 1rem;
  cursor: pointer;
}
.ep-when { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ep-title { font-family: var(--serif); font-size: 1rem; line-height: 1.4; }
.ep-row:hover .ep-title { color: var(--accent); }
.ep-src { font-size: 0.7rem; color: var(--faint); white-space: nowrap; letter-spacing: 0.02em; }
.ep-play {
  align-self: center; justify-self: end;
  width: 2rem; height: 2rem;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--bg);
  color: var(--fg);
}
.ep-play:hover { background: var(--fg); color: var(--bg); }
.ep-play svg { width: 0.7rem; height: 0.7rem; }
.ep.playing .ep-play { background: var(--accent); color: var(--bg); }
.ep.playing .ep-title { color: var(--accent); }

.ep-body { display: none; padding: 0 3.25rem 1.1rem 9.5rem; }
.ep.open .ep-body { display: block; }
.ep-meta { font-size: 0.8rem; color: var(--fg); margin-bottom: 0.4rem; }
.ep-desc { font-size: 0.86rem; color: var(--muted); line-height: 1.7; margin-bottom: 0.6rem; max-width: 62ch; }
.ep-desc.empty { font-style: italic; color: var(--faint); }
.ep-link { font-size: 0.78rem; color: var(--muted); text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 3px; }
.ep-link:hover { color: var(--fg); text-decoration-color: currentColor; }

.no-results-msg { padding: 4rem 0; text-align: center; font-size: 0.9rem; color: var(--muted); font-style: italic; }

/* ── Reproductor ── */
.player {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 200;
  background: var(--bg-3);
}
.player[hidden] { display: none; }
.player-in { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 1rem; padding: 0.65rem 0; }
.p-btns { display: flex; align-items: center; gap: 0.25rem; }
.p-btn { width: 2.25rem; height: 2.25rem; display: grid; place-items: center; color: var(--muted); border-radius: 50%; }
.p-btn:hover { color: var(--fg); }
.p-btn svg { width: 1.1rem; height: 1.1rem; }
.p-main { width: 2.6rem; height: 2.6rem; background: var(--fg); color: var(--bg); }
.p-main:hover { color: var(--bg); opacity: 0.85; }
.p-main svg { width: 0.9rem; height: 0.9rem; }
.p-info { min-width: 0; }
.p-title { font-family: var(--serif); font-size: 0.92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-sub { font-size: 0.7rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-seek { display: flex; align-items: center; gap: 0.6rem; margin-top: 0.3rem; font-family: var(--mono); font-size: 0.68rem; color: var(--muted); }
.p-seek input { flex: 1; min-width: 0; height: 1rem; accent-color: var(--fg); cursor: pointer; }
.p-rate { font-family: var(--mono); font-size: 0.72rem; width: 3rem; height: 2rem; color: var(--muted); }
.p-rate:hover { color: var(--fg); }
.p-side { display: flex; align-items: center; gap: 0.25rem; }

/* ── Responsive ── */
@media (max-width: 680px) {
  .wrap { padding: 0 1rem; }
  .tabs-label { display: none; }
  .controls-row { gap: 0.75rem; padding: 0.4rem 0; }
  .tabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; gap: 0 0.9rem; mask-image: linear-gradient(to right, #000 85%, transparent); }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button:last-child { margin-right: 1.5rem; }
  .fold-all { min-height: 36px; }
  .tabs button { min-height: 36px; }
  .era-head { position: static; }
  .page-intro { padding: 2.25rem 0 1.75rem; }
  .page-title { font-size: 1.8rem; }
  .ep-row { grid-template-columns: 1fr 2.25rem; grid-template-areas: "when play" "title play" "src play"; gap: 0.1rem 0.75rem; }
  .ep-when { grid-area: when; }
  .ep-title { grid-area: title; }
  .ep-src { grid-area: src; }
  .ep-play { grid-area: play; }
  .ep-row { padding: 0.7rem 0.75rem; }
  .ep-body { padding: 0 0.75rem 1rem; }
  .era-toggle { padding: 0.8rem 0.75rem 0.7rem; }
  .player-in { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "info side" "btns btns"; gap: 0.3rem 0.5rem; }
  .p-info { grid-area: info; }
  .p-side { grid-area: side; }
  .p-btns { grid-area: btns; justify-content: center; }
}
</style>
</head>

<script>
function parseYear(raw) {
  if (!raw) return null;
  const s = String(raw).trim();
  if (/^-?\d+$/.test(s)) return parseInt(s, 10);
  const r = s.match(/^(-?\d+)\s*[-–]\s*(-?\d+)$/);
  if (r) return parseInt(r[1], 10);
  const ac = s.match(/^(\d+)\s*aC$/i);
  if (ac) return -parseInt(ac[1], 10);
  const n = s.match(/-?\d+/);
  if (n) return parseInt(n[0], 10);
  return null;
}

function getEra(y) {
  if (y === null) return 'desconegut';
  if (y < -3000)  return 'prehistoria';
  if (y < 500)    return 'antiguitat';
  if (y < 1500)   return 'medieval';
  if (y < 1800)   return 'moderna';
  return 'contemporania';
}

const ERA_META = {
  prehistoria:   { label: 'Prehistòria',        years: 'fins al 3000 aC' },
  antiguitat:    { label: 'Antiguitat',         years: '3000 aC – 500 dC' },
  medieval:      { label: 'Edat Mitjana',       years: '500 – 1500' },
  moderna:       { label: 'Edat Moderna',       years: '1500 – 1800' },
  contemporania: { label: 'Edat Contemporània', years: '1800 – avui' },
  desconegut:    { label: 'Sense data',         years: '' },
};
const ERA_ORDER = ['prehistoria', 'antiguitat', 'medieval', 'moderna', 'contemporania', 'desconegut'];
function fmtYear(n) {
  const a = Math.abs(n);
  return a >= 10000 ? a.toLocaleString('ca-ES') : String(a);
}
function formatWhen(raw) {
  if (raw == null || raw === 'None') return '—';
  const s = String(raw).trim();
  const m = s.match(/^(-?\d+)(?:\s*[-–]\s*(-?\d+))?$/);
  if (!m) return s;
  const a = +m[1];
  if (m[2] === undefined) return fmtYear(a) + (a < 0 ? ' aC' : '');
  const b = +m[2];
  if (a < 0 && b < 0) return `${fmtYear(a)}–${fmtYear(b)} aC`;
  if (a < 0) return `${fmtYear(a)} aC – ${fmtYear(b)}`;
  return `${fmtYear(a)}–${fmtYear(b)}`;
}

const SRC_LABEL = { 'portes-de-troia': 'Portes de Troia', 'en-guardia': 'En Guàrdia', 'institut-humanitats': "Inst. d'Humanitats" };

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

let currentPodcast = 'all';
let currentSearch = '';
let data = [];
const rows = [];        // { el, ep, era, text }
const sections = {};    // era -> { el, count }
let collapsed = new Set(store.get('collapsed') || []);

const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';

function playable(ep) {
  return ep.podcast === 'en-guardia' ? !!ep.id_3cat : !!ep.ivoox;
}

function injectJSONLD(data) {
  const albert = {
    '@type': 'Person',
    '@id': 'https://allr.cat/#albert-lloreta',
    'name': 'Albert Lloreta',
    'url': 'https://allr.cat'
  };
  const podcast = {
    '@type': 'PodcastSeries',
    '@id': 'https://www.portesdetroia.cat/#podcast',
    'name': 'A les Portes de Troia',
    'description': 'Podcast d\'història en català, emès des de Ràdio Castellar i distribuït per La Xarxa.',
    'url': 'https://www.portesdetroia.cat',
    'inLanguage': 'ca',
    'startDate': '2013',
    'author': [
      {'@type': 'Person', 'name': 'Alberto Reche'},
      {'@type': 'Person', 'name': 'Sergio Rodríguez'},
      {'@type': 'Person', 'name': 'Albert Abril'}
    ]
  };
  const podcastGuardia = {
    '@type': 'PodcastSeries',
    '@id': 'https://www.3cat.cat/3cat/en-guardia/#podcast',
    'name': 'En Guàrdia',
    'description': 'Podcast d\'història de Catalunya Ràdio, dirigit per Josep Maria Solé i Sabaté.',
    'url': 'https://www.3cat.cat/3cat/en-guardia/',
    'inLanguage': 'ca'
  };
  const ihb = {
    '@type': 'Organization',
    '@id': 'https://www.instituthumanitats.org/#org',
    'name': 'Institut d\'Humanitats de Barcelona',
    'url': 'https://www.instituthumanitats.org'
  };
  const webpage = {
    '@type': 'WebPage',
    '@id': 'https://historia.allr.cat',
    'name': 'Història en Podcasts',
    'description': 'Episodis de podcasts d\'història en català endreçats en ordre cronològic, des de la prehistòria fins avui.',
    'url': 'https://historia.allr.cat',
    'inLanguage': 'ca',
    'author': {'@id': 'https://allr.cat/#albert-lloreta'},
    'about': [{'@id': 'https://www.portesdetroia.cat/#podcast'}, {'@id': 'https://www.3cat.cat/3cat/en-guardia/#podcast'}, {'@id': 'https://www.instituthumanitats.org/#org'}]
  };
  const episodes = data.map(ep => {
    if (ep.podcast === 'institut-humanitats') {
      const obj = {
        '@type': ep.format === 'video' ? 'VideoObject' : 'AudioObject',
        '@id': ep.enllac,
        'name': ep.titol,
        'url': ep.enllac,
        'publisher': {'@id': 'https://www.instituthumanitats.org/#org'}
      };
      if (ep.descripcio) obj.description = ep.descripcio;
      if (ep.data_historica) obj.temporalCoverage = ep.data_historica;
      return obj;
    }
    const seriesId = ep.podcast === 'en-guardia'
      ? 'https://www.3cat.cat/3cat/en-guardia/#podcast'
      : 'https://www.portesdetroia.cat/#podcast';
    const obj = {
      '@type': 'PodcastEpisode',
      '@id': ep.enllac || `https://historia.allr.cat/#ep-${ep.num}`,
      'partOfSeries': {'@id': seriesId},
      'name': ep.titol,
      'episodeNumber': ep.num,
      'inLanguage': 'ca'
    };
    if (ep.descripcio) obj.description = ep.descripcio;
    if (ep.enllac) obj.url = ep.enllac;
    if (ep.data_historica) obj.temporalCoverage = ep.data_historica;
    return obj;
  });
  const script = document.createElement('script');
  script.type = 'application/ld+json';
  script.textContent = JSON.stringify({
    '@context': 'https://schema.org',
    '@graph': [albert, podcast, podcastGuardia, ihb, webpage, ...episodes]
  });
  document.head.appendChild(script);
}

async function init() {
  const [rawAdpt, rawGuardia, rawIhb] = await Promise.all([
    fetch('episodis-portes-de-troia.json').then(r => r.json()),
    fetch('episodis-en-guardia.json').then(r => r.json()),
    fetch('sessions-institut-humanitats.json').then(r => r.json()),
  ]);
  data = [...rawAdpt, ...rawGuardia, ...rawIhb]
    .filter(e => e.titol)
    .map(e => ({ ...e, _year: parseYear(e.data_historica) }));
  data.forEach(e => {
    e._era = getEra(e._year);
    e._key = `${e.podcast}:${e.num ?? e.id_3cat ?? e.nid}`;
  });
  data.sort((a, b) => {
    if (a._year === null && b._year === null) return (a.num ?? 0) - (b.num ?? 0);
    if (a._year === null) return 1;
    if (b._year === null) return -1;
    return a._year - b._year;
  });

  document.querySelectorAll('[data-count]').forEach(el => {
    el.textContent = data.filter(e => e.podcast === el.dataset.count).length.toLocaleString('ca-ES');
  });

  const main = document.getElementById('main');
  const noResults = document.getElementById('no-results');

  ERA_ORDER.forEach(era => {
    const eps = data.filter(e => e._era === era);
    if (!eps.length) return;
    const m = ERA_META[era];

    const section = document.createElement('section');
    section.className = 'era-section' + (collapsed.has(era) ? ' collapsed' : '');
    section.id = `era-${era}`;
    section.innerHTML = `
      <header class="era-head">
        <h2><button class="era-toggle" type="button" aria-expanded="${!collapsed.has(era)}" aria-controls="body-${era}">
          <svg class="era-chev" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4l4 4 4-4"/></svg>
          <span class="era-name">${m.label}</span>
          <span class="era-years">${m.years}</span>
          <span class="era-count"></span>
        </button></h2>
      </header>
      <ol class="era-body" id="body-${era}"></ol>
    `;
    main.insertBefore(section, noResults);
    sections[era] = { el: section, countEl: section.querySelector('.era-count') };

    const body = section.querySelector('.era-body');
    const frag = document.createDocumentFragment();
    eps.forEach(ep => {
      const i = rows.length;
      const li = document.createElement('li');
      li.className = 'ep';
      li.dataset.i = i;
      const period = formatWhen(ep.ubicacio || ep.data_historica);
      const isIhb = ep.podcast === 'institut-humanitats';
      const tag = isIhb ? (ep.format === 'video' ? 'vídeo' : 'àudio') : (ep.num != null ? `ep. ${ep.num}` : '');
      const meta = isIhb ? [ep.curs, (ep.ponents || []).join(', ')].filter(Boolean).join(' · ') : '';
      const linkLabel = isIhb && ep.format === 'video' ? 'Mireu-lo a la font' : 'Obre a la font';

      li.innerHTML = `
        <div class="ep-row">
          <span class="ep-when">${period}</span>
          <h3 class="ep-title">${ep.titol}</h3>
          <span class="ep-src">${SRC_LABEL[ep.podcast]}${tag ? ' · ' + tag : ''}</span>
          ${playable(ep) ? `<button class="ep-play" type="button" aria-label="Reprodueix">${ICON_PLAY}</button>` : '<span></span>'}
        </div>
        <div class="ep-body">
          ${meta ? `<p class="ep-meta">${meta}</p>` : ''}
          ${ep.descripcio ? `<p class="ep-desc">${ep.descripcio}</p>` : '<p class="ep-desc empty">Sense descripció disponible.</p>'}
          ${ep.enllac ? `<a class="ep-link" href="${ep.enllac}" target="_blank" rel="noopener">${linkLabel} →</a>` : ''}
        </div>
      `;
      frag.appendChild(li);
      rows.push({
        el: li, ep, era,
        text: [ep.num, ep.titol, ep.descripcio, ep.ubicacio, ep.data_historica, ep.curs, ...(ep.ponents || [])]
          .filter(Boolean).join(' ').toLowerCase()
      });
    });
    body.appendChild(frag);
  });

  injectJSONLD(data);
  applyFilters();
  updateFoldAll();
  measureControls();
  restorePlayer();
}

function applyFilters() {
  const q = currentSearch.toLowerCase().trim();
  const counts = {};
  let visible = 0;
  rows.forEach(r => {
    const show = (currentPodcast === 'all' || r.ep.podcast === currentPodcast) && (!q || r.text.includes(q));
    r.el.hidden = !show;
    r.visible = show;
    if (show) { counts[r.era] = (counts[r.era] || 0) + 1; visible++; }
  });
  for (const era in sections) {
    const c = counts[era] || 0;
    sections[era].el.hidden = c === 0;
    sections[era].countEl.textContent = `${c} ep.`;
  }
  const hasFilter = q || currentPodcast !== 'all';
  document.getElementById('search-count').textContent = hasFilter ? `${visible} resultats` : '';
  document.getElementById('no-results').hidden = visible !== 0;
}

/* ── Plegar / desplegar ── */
function setCollapsed(era, value) {
  const s = sections[era];
  if (!s) return;
  s.el.classList.toggle('collapsed', value);
  s.el.querySelector('.era-toggle').setAttribute('aria-expanded', String(!value));
  value ? collapsed.add(era) : collapsed.delete(era);
}
function saveCollapsed() { store.set('collapsed', [...collapsed]); updateFoldAll(); }
function updateFoldAll() {
  const all = Object.keys(sections).every(e => collapsed.has(e));
  document.getElementById('fold-all').textContent = all ? 'Desplega-ho tot' : 'Plega-ho tot';
}

document.getElementById('fold-all').addEventListener('click', () => {
  const all = Object.keys(sections).every(e => collapsed.has(e));
  Object.keys(sections).forEach(e => setCollapsed(e, !all));
  saveCollapsed();
});

document.getElementById('main').addEventListener('click', e => {
  const toggle = e.target.closest('.era-toggle');
  if (toggle) {
    const era = toggle.closest('.era-section').id.slice(4);
    const wasOpen = !collapsed.has(era);
    setCollapsed(era, wasOpen);
    saveCollapsed();
    if (wasOpen) scrollToEra(era, 'auto');
    return;
  }
  const li = e.target.closest('.ep');
  if (!li) return;
  if (e.target.closest('.ep-play')) { playRow(+li.dataset.i); return; }
  if (e.target.closest('.ep-row')) li.classList.toggle('open');
});

function scrollToEra(era, behavior = 'smooth') {
  const s = sections[era];
  if (!s) return;
  const h = document.getElementById('controls').offsetHeight;
  const y = s.el.getBoundingClientRect().top + window.scrollY - h;
  if (behavior === 'auto' && s.el.getBoundingClientRect().top > h) return;
  window.scrollTo({ top: y, behavior });
}

document.getElementById('era-nav').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const era = btn.dataset.era;
  if (collapsed.has(era)) { setCollapsed(era, false); saveCollapsed(); }
  scrollToEra(era);
});

document.getElementById('search').addEventListener('input', e => {
  currentSearch = e.target.value;
  applyFilters();
});

document.getElementById('podcast-nav').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  document.querySelectorAll('#podcast-nav button').forEach(b => b.classList.toggle('active', b === btn));
  currentPodcast = btn.dataset.podcast;
  applyFilters();
});

function measureControls() {
  document.documentElement.style.setProperty('--controls-h', document.getElementById('controls').offsetHeight + 'px');
}
window.addEventListener('resize', measureControls);

/* ══════════ Reproductor ══════════ */
const audio = document.getElementById('audio');
const player = document.getElementById('player');
const $ = id => document.getElementById(id);
const RATES = [1, 1.25, 1.5, 1.75, 2];
let cur = null;          // índex de fila en reproducció
let lastSave = 0;

const fmt = s => {
  if (!isFinite(s)) return '0:00';
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, sec = String(s % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${sec}` : `${m}:${sec}`;
};

async function audioUrl(ep) {
  if (ep.podcast !== 'en-guardia') return `https://www.ivoox.com/listen_mn_${ep.ivoox}_1.mp3`;
  const r = await fetch(`https://api-media.3cat.cat/pvideo/media.jsp?media=audio&idint=${ep.id_3cat}`);
  const media = (await r.json()).media;
  return (Array.isArray(media) ? media[0] : media).url;
}

function showPlayer() {
  if (!player.hidden) return;
  player.hidden = false;
  document.documentElement.style.setProperty('--player-h', player.offsetHeight + 'px');
}

async function playRow(i, { autoplay = true, at = null } = {}) {
  if (i === cur) { audio.paused ? audio.play() : audio.pause(); return; }
  const r = rows[i];
  if (!r) return;
  savePos();
  if (cur !== null) markRow(cur, false);
  cur = i;
  const ep = r.ep;
  $('p-title').textContent = ep.titol;
  $('p-sub').textContent = [formatWhen(ep.ubicacio || ep.data_historica), SRC_LABEL[ep.podcast], ep.num != null ? `ep. ${ep.num}` : ''].filter(Boolean).join(' · ');
  $('p-cur').textContent = '0:00'; $('p-dur').textContent = '0:00'; $('p-seek').value = 0;
  showPlayer();
  markRow(i, true);
  store.set('last', ep._key);
  try {
    audio.src = await audioUrl(ep);
  } catch {
    $('p-sub').textContent = "No s'ha pogut carregar l'àudio.";
    return;
  }
  if (cur !== i) return;
  const pos = at ?? store.get('pos:' + ep._key);
  if (pos) audio.addEventListener('loadedmetadata', () => { audio.currentTime = pos; }, { once: true });
  audio.playbackRate = store.get('rate') || 1;
  if (autoplay) audio.play().catch(() => {});
  else audio.load();
  setMediaSession(ep);
}

function markRow(i, on) {
  const el = rows[i]?.el;
  if (!el) return;
  el.classList.toggle('playing', on);
  const btn = el.querySelector('.ep-play');
  if (btn) {
    const playingNow = on && !audio.paused;
    btn.innerHTML = playingNow ? ICON_PAUSE : ICON_PLAY;
    btn.setAttribute('aria-label', playingNow ? 'Pausa' : 'Reprodueix');
  }
}

function syncState() {
  const playing = !audio.paused;
  $('p-icon').setAttribute('d', playing ? 'M6 4h4v16H6zM14 4h4v16h-4z' : 'M7 4l13 8-13 8z');
  $('p-toggle').setAttribute('aria-label', playing ? 'Pausa' : 'Reprodueix');
  if (cur !== null) markRow(cur, true);
}

function savePos() {
  if (cur === null || !audio.currentTime) return;
  const key = 'pos:' + rows[cur].ep._key;
  const near = audio.duration && audio.duration - audio.currentTime < 30;
  store.set(key, near ? 0 : Math.floor(audio.currentTime));
}

audio.addEventListener('play', syncState);
audio.addEventListener('pause', () => { syncState(); savePos(); });
audio.addEventListener('loadedmetadata', () => {
  $('p-seek').max = Math.floor(audio.duration) || 0;
  $('p-dur').textContent = fmt(audio.duration);
});
audio.addEventListener('timeupdate', () => {
  if (!seeking) $('p-seek').value = Math.floor(audio.currentTime);
  $('p-cur').textContent = fmt(audio.currentTime);
  const now = Date.now();
  if (now - lastSave > 5000) { lastSave = now; savePos(); }
});
audio.addEventListener('ended', () => {
  savePos();
  // Següent episodi visible (en ordre cronològic) que es pugui reproduir
  for (let j = cur + 1; j < rows.length; j++) {
    if (rows[j].visible && playable(rows[j].ep)) { playRow(j, { at: 0 }); return; }
  }
});
audio.addEventListener('error', () => {
  if (audio.getAttribute('src')) $('p-sub').textContent = "No s'ha pogut reproduir l'àudio.";
});

let seeking = false;
$('p-seek').addEventListener('input', () => { seeking = true; $('p-cur').textContent = fmt(+$('p-seek').value); });
$('p-seek').addEventListener('change', () => { audio.currentTime = +$('p-seek').value; seeking = false; });

$('p-toggle').addEventListener('click', () => { audio.paused ? audio.play() : audio.pause(); });
$('p-back').addEventListener('click', () => { audio.currentTime = Math.max(0, audio.currentTime - 15); });
$('p-fwd').addEventListener('click', () => { audio.currentTime = Math.min(audio.duration || Infinity, audio.currentTime + 30); });
$('p-rate').addEventListener('click', () => {
  const next = RATES[(RATES.indexOf(audio.playbackRate) + 1) % RATES.length];
  audio.playbackRate = next;
  store.set('rate', next);
  $('p-rate').textContent = next + '×';
});
$('p-close').addEventListener('click', () => {
  audio.pause();
  savePos();
  if (cur !== null) { rows[cur].el.classList.remove('playing'); markRow(cur, false); }
  cur = null;
  audio.removeAttribute('src'); audio.load();
  player.hidden = true;
  document.documentElement.style.setProperty('--player-h', '0px');
  store.set('last', null);
});
$('p-title').addEventListener('click', () => {
  if (cur === null) return;
  const r = rows[cur];
  if (collapsed.has(r.era)) { setCollapsed(r.era, false); saveCollapsed(); }
  r.el.classList.add('open');
  r.el.scrollIntoView({ block: 'center', behavior: 'smooth' });
});
$('p-title').style.cursor = 'pointer';

document.addEventListener('keydown', e => {
  if (e.code !== 'Space' || cur === null || e.target.closest('input, button, a')) return;
  e.preventDefault();
  audio.paused ? audio.play() : audio.pause();
});

function setMediaSession(ep) {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({ title: ep.titol, artist: SRC_LABEL[ep.podcast], album: 'Història en Podcasts' });
  const ms = navigator.mediaSession;
  ms.setActionHandler('play', () => audio.play());
  ms.setActionHandler('pause', () => audio.pause());
  ms.setActionHandler('seekbackward', () => { audio.currentTime -= 15; });
  ms.setActionHandler('seekforward', () => { audio.currentTime += 30; });
}

function restorePlayer() {
  const rate = store.get('rate');
  if (rate) $('p-rate').textContent = rate + '×';
  const key = store.get('last');
  if (!key) return;
  const i = rows.findIndex(r => r.ep._key === key);
  if (i >= 0) playRow(i, { autoplay: false });
}

window.addEventListener('pagehide', savePos);

init();
</script>
</body>
</html>
